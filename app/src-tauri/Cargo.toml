[package]
name = "agent-mobile-bridge"
version = "0.1.0"
description = "Agent Mobile Bridge 调试 App（Tauri 2 Android）"
edition = "2021"
rust-version = "1.77.2"

# 隔离根仓库 workspace（根 Cargo.toml 是单 crate，本 crate 独立）
[workspace]

[lib]
name = "agent_mobile_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
