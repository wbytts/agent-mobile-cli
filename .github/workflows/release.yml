name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v0.0.1）；仅手动触发时需要"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI 各平台二进制 ──────────────────────────────────────────
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner 原生平台直接编；asset 名与 npm postinstall 下载约定一致
          { os: macos-14, target: aarch64-apple-darwin, plat: darwin-arm64 }
          { os: macos-14, target: x86_64-apple-darwin, plat: darwin-x64 }
          { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, plat: linux-x64 }
          { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, plat: linux-arm64, cross: true }
          { os: windows-2022, target: x86_64-pc-windows-msvc, plat: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 linux-arm64 交叉链接器
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 装配资产
        shell: bash
        run: |
          mkdir -p dist/release-assets
          exe="agent-mobile-cli"
          asset="agent-mobile-cli-${{ matrix.plat }}"
          if [ "${{ matrix.plat }}" = "win32-x64" ]; then exe="$exe.exe"; asset="$asset.exe"; fi
          cp "target/${{ matrix.target }}/release/$exe" "dist/release-assets/$asset"
          sha256sum "dist/release-assets/$asset" >> dist/release-assets/checksums.txt
          cat dist/release-assets/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.plat }}
          path: dist/release-assets/
          retention-days: 7

  # ── Android 桥接 App（Agent Mobile Bridge APK） ───────────────
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 cargo-tauri（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri

      - name: 确认 NDK（runner 预装 Android SDK/NDK）
        run: |
          ls "$ANDROID_HOME/ndk/"
          echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: 构建 APK（aarch64 debug）
        working-directory: app
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: --target=aarch64-linux-android24 --sysroot=${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: cargo tauri android build --debug --target aarch64

      - name: 装配资产
        run: |
          mkdir -p dist/release-assets
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             dist/release-assets/agent-mobile-bridge.apk
          sha256sum dist/release-assets/agent-mobile-bridge.apk >> dist/release-assets/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/release-assets/
          retention-days: 7

  # ── 汇总并发布到 GitHub Release ───────────────────────────────
  publish:
    needs: [cli, apk]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist/release-assets

      - name: 汇总校验清单（按文件名排序去重）
        run: |
          cd dist/release-assets
          sort -t' ' -k3 -u checksums.txt > checksums.sorted || sort -u checksums.txt > checksums.sorted
          mv checksums.sorted checksums.txt
          ls -la && cat checksums.txt

      - name: 解析 tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          [ -n "$TAG" ] || { echo "缺少 tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/release-assets/*
          generate_release_notes: true
