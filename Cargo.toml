[package]
name = "agent-mobile-cli"
version = "0.1.0"
edition = "2021"
description = "面向 Agent 的 Android 设备感知与控制 CLI（ADB 直连 + 调试 App 桥接）"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
which = "6"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-tungstenite = "0.24"
quick-xml = { version = "0.36", features = ["serialize"] }
parking_lot = "0.12"
libc = "0.2"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
